        /* Custom scrollbar */

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {

        }

        /* Slide transition animations */
        .slide-enter {
            animation: fadeInRight 0.35s ease-out forwards;
        }
        .slide-exit {
            animation: fadeOutLeft 0.35s ease-out forwards;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeOutLeft {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(-20px);
            }
        }

        /* Card bounce effect on hover */
        .card-interactive {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-interactive:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(30, 58, 138, 0.2);
        }

        /* Pulse highlight for CTA button */

            50% {
                box-shadow: 0 0 0 14px rgba(239, 68, 68, 0);

        }
        .cta-pulse {

        const playSound = (freq = 440, type = 'sine', duration = 0.08) => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                // Audio not allowed without prior interaction or unsupported
            }
        };

            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-all duration-200 ${i === currentSlideIndex ? 'bg-blue-600 w-6' : 'bg-slate-300 hover:bg-slate-400'}`;
                dot.title = `スライド ${i + 1}`;
                dot.onclick = () => jumpToSlide(i);
                dotIndicatorsEl.appendChild(dot);
            }
        }

        function updateDots(activeIndex) {
            const dots = dotIndicatorsEl.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === activeIndex) {
                    dots[i].className = "w-6 h-3 bg-blue-600 rounded-full transition-all duration-200";
                } else {
                    dots[i].className = "w-3 h-3 bg-slate-300 hover:bg-slate-400 rounded-full transition-all duration-200";
                }
            }
        }

        // スライド切り替え関数
        function changeSlide(direction) {
            const newIndex = currentSlideIndex + direction;
            if (newIndex >= 0 && newIndex < totalSlides) {
                playSound(500 + direction * 100);
                currentSlideIndex = newIndex;
                renderSlide(currentSlideIndex);
            }
        }

        function jumpToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                playSound(550);
                currentSlideIndex = index;
                renderSlide(currentSlideIndex);
                closeIndexModal();
            }
        }

        // スライド1：カードタップ時の雑学表示
        function toggleCardFact(element) {
            playSound(700);
            const factBox = element.querySelector('.fact-box');
            if (factBox) {
                factBox.classList.toggle('hidden');
            }
        }

        // スライド8：クイズ正誤判定
        function checkAnswer(btn, isCorrect) {
            const resultBox = document.getElementById('quizResult');
            const buttons = document.querySelectorAll('#quizOptions button');
            
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-50');
            });

            resultBox.classList.remove('hidden');
            if (isCorrect) {
                playSound(880, 'triangle', 0.2);
                btn.classList.remove('opacity-50', 'bg-white');
                btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                resultBox.className = "mt-2 p-2 rounded-lg text-xs font-bold text-center bg-emerald-100 text-emerald-800 border border-emerald-300";
                resultBox.innerHTML = "🎉 大正解！「わき芽かき」を行うことで栄養が主枝に集まり甘くて大きい実になります！";
            } else {
                playSound(220, 'sawtooth', 0.2);
                btn.classList.remove('opacity-50', 'bg-white');
                btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                resultBox.className = "mt-2 p-2 rounded-lg text-xs font-bold text-center bg-rose-100 text-rose-800 border border-rose-300";
                resultBox.innerHTML = "❌ 残念！正解は「B. わき芽かき」でした。スライド4で確認してみてね！";
            }
        }

        // 目次モーダル操作
        function openIndexModal() {
            playSound(600);
            modalIndexList.innerHTML = slidesData.map((s, idx) => `
                <button onclick="jumpToSlide(${idx})" class="p-3 text-left rounded-xl border ${idx === currentSlideIndex ? 'border-blue-500 bg-blue-50/80 font-bold' : 'border-slate-200 hover:bg-slate-50'} transition flex items-center justify-between group">
                    <div>
                        <span class="text-xs font-bold text-blue-600 block">${s.tag}</span>
                        <span class="text-sm text-slate-800">${s.title}</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-blue-600 transition"></i>
                </button>
            `).join('');

            indexModal.classList.remove('hidden');
            setTimeout(() => {
                indexModal.classList.remove('opacity-0');
            }, 10);
        }

        function closeIndexModal() {
            indexModal.classList.add('opacity-0');
            setTimeout(() => {
                indexModal.classList.add('hidden');
            }, 200);
        }

        // フルスクリーン切り替え
        function toggleFullscreen() {
            playSound(650);
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
                document.getElementById('fullscreenIcon').className = "fa-solid fa-compress";
                document.getElementById('fullscreenText').textContent = "標準";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fullscreenIcon').className = "fa-solid fa-expand";
                    document.getElementById('fullscreenText').textContent = "大画面";
                }
            }
        }

        // キーボード操作サポート（左右矢印キー）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                changeSlide(1);
            } else if (e.key === 'ArrowLeft') {
                changeSlide(-1);
            } else if (e.key === 'Escape') {
                closeIndexModal();
            }
        });

        // アプリ初期化処理
        window.addEventListener('DOMContentLoaded', () => {
            createDots();
            renderSlide(currentSlideIndex);
        });
    </script>
</body>
</html>
